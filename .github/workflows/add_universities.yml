name: Add New Engineering Universities

on:
  schedule:
    - cron: '0 7 * * 0'  # Runs once a week on Sundays at 07:00 UTC
  workflow_dispatch:      # Allows you to run it manually anytime

jobs:
  add-universities:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl

      - name: Run University Discovery Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python add_universities.py

      - name: Commit and push updated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add "List of emails.xlsx" "List of emails.xlsx - Sheet1.csv" 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Append new engineering universities [skip ci]" && git push origin main)
